# b2: b1 with the torso changed to T5Gemma 2 4B+4B. See research/preregistrations/PREREGISTRATION-b2.md.
#
#   b1 (1B+1B on g4's recipe) scored JevBench 153: order sensitivity and calibration held,
#   reasoning and adequacy failed at every prompt length. b1's outcome reads that as torso
#   capacity (Gemma 3 1B base). b2 changes only base_model, so the torso is the variable:
#   same rows, targets, head, LoRA, schedule and speed settings. Trained on one g7e
#   (RTX PRO 6000, 96 GB), where micro-batch 16 x 2 fits (estimated 50-55 GiB).
#   The comment block below this one is b1's, kept verbatim.
#
# b1: g4's recipe on a T5Gemma 2 (1B+1B) torso. See research/preregistrations/PREREGISTRATION-b1.md
# and docs/bidi-design.md.
#
#   The torso is the variable. The rows and targets are g4's (the hobson-gemma4 fork's
#   reference, JevBench public 183/231): v19's six training files, gemma-4-31B-it's answer
#   distributions on the short-task, generated and adequacy rows, v14's replay on the
#   multi-step rows, gold alone on the rating-scale rows, and no frozen-torso anchor.
#   The whole prompt goes through the bidirectional encoder; the decoder reads one token
#   (<bos>), whose state is the pointer query; option keys are encoder states at each
#   option line's last token (Phase 0: +0.05 over the line mean).
#
#   Changed from g4 besides the torso, for speed only: micro-batch 16 x grad_accum 2 (g4:
#   8 x 4; the same 32 rows per optimizer step) and compiled torso layers. Phase 0 found a
#   step CPU-bound on kernel launches: 2.9x the rows per second at 256 tokens.

train_files: ["data/train_v5.jsonl", "data/multistep_v14.jsonl", "data/generated_v16.jsonl",
              "data/generated_v18.jsonl", "data/adequacy_hs2.jsonl", "data/adequacy_gen.jsonl"]
val_fraction: 0.03

base_model: "google/t5gemma-2-4b-4b"   # revision 487d4ac, the snapshot staged for the host
num_slots: 24           # must match `data build --max-options`; also the KL reference width
head_type: "xpointer"   # pointer readout with separate query/key norms; see modeling.CrossPointerHead
pointer_dim: 256
head_init: "random"
kl_frozen_weight: 0.0   # no frozen-torso anchor: the untrained readout is 0.33 (Phase 0)
teacher_file: "data/teacher_g4.jsonl"   # training/recipe.sh teacher31b
teacher_weight: 1.0
head_dropout: 0.05
max_length: 4096        # the serving default; no training row is near it
attn_implementation: "sdpa"

use_lora: true
lora_r: 16
lora_alpha: 32
# Encoder and decoder alike; the vision tower is dropped before LoRA attaches.
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
freeze_torso: false

epochs: 1
micro_batch_size: 16
grad_accum: 2           # effective batch 32, as g4
lr: 0.0001              # LoRA
head_lr: 0.001
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true
compile_layers: true

shuffle_options: true
group_by_length: true
ordinal_smoothing: 0.1
reverse_score_prob: 0.5

output_dir: "checkpoints/bidi-b2"
seed: 0
log_every: 20
eval_every: 500
