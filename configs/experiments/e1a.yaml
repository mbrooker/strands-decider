# e1a: an encoder-only torso, the T5Gemma 2B-it UL2 encoder, unmasked. See
# research/preregistrations/PREREGISTRATION-e1.md and docs/encoder-design.md.
#
#   b1's recipe and rows (g4's: v19's six files, the gemma-4-31B-it teacher file, no frozen
#   anchor) with the torso changed to the encoder of google/t5gemma-2b-2b-ul2-it (decoder
#   dropped; SDPA, which drops Gemma 2's attention soft-cap, in training and serving alike).
#   Query: the mean over the prompt (encoder Phase 0's best on the reasoning slices); keys:
#   each option line's last token. micro_batch_size is set by the smoke test (8 x 4, or
#   4 x 8 if 8 does not fit); either way a step is 32 rows.

train_files: ["data/train_v5.jsonl", "data/multistep_v14.jsonl", "data/generated_v16.jsonl",
              "data/generated_v18.jsonl", "data/adequacy_hs2.jsonl", "data/adequacy_gen.jsonl"]
val_fraction: 0.03

base_model: "google/t5gemma-2b-2b-ul2-it"
num_slots: 24           # must match `data build --max-options`; also the KL reference width
head_type: "xpointer"   # separate query/key norms: a mean and a token state differ in scale
query_pool: "mean"
pointer_dim: 256
head_init: "random"
kl_frozen_weight: 0.0   # an encoder has no LM readout to anchor to
teacher_file: "data/teacher_g4.jsonl"   # training/recipe.sh teacher31b
teacher_weight: 1.0
head_dropout: 0.05
max_length: 4096        # the serving default; no training row is near it
attn_implementation: "sdpa"

use_lora: true
lora_r: 16
lora_alpha: 32
# The encoder's attention and MLP projections (the decoder is not loaded).
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
freeze_torso: false

epochs: 1
micro_batch_size: 8
grad_accum: 4           # effective batch 32, as g4
lr: 0.0001              # LoRA
head_lr: 0.001
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true
compile_layers: true

shuffle_options: true
group_by_length: true
ordinal_smoothing: 0.1
reverse_score_prob: 0.5

output_dir: "checkpoints/bidi-e1a"
seed: 0
log_every: 20
eval_every: 500
